name: Kiosk Auto Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Install to 2 kiosks via ADB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          for device in 192.168.0.21:5555; do
              echo "Installing on $device ..."
              adb -s $device install -r "$APK_PATH" || echo "❌ Failed on $device"
          done
